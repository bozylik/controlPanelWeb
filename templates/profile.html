{% extends "base.html" %}
{% block content %}
<h1>👤 Мой профиль</h1>

<div class="profile-sections">
    <div class="profile-section">
        <h3>📋 Информация</h3>
        <form method="POST" action="{{ url_for('profile.update_profile') }}">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" value="{{ user.username }}" disabled>
            </div>
            <div class="form-group">
                <label>Роль</label>
                <input type="text" value="{{ user.role }}" disabled>
            </div>
            <div class="form-group">
                <label>ФИО</label>
                <input type="text" name="fio" value="{{ user.fio }}" required>
            </div>
            <div class="form-group">
                <label>Дата регистрации</label>
                <input type="text" value="{{ user.created_at }}" disabled>
            </div>
            <button type="submit" class="btn-primary">Сохранить</button>
        </form>
    </div>

    <div class="profile-section">
        <h3>🔒 Смена пароля</h3>
        <form method="POST" action="{{ url_for('profile.change_password') }}">
            <div class="form-group">
                <label>Текущий пароль</label>
                <input type="password" name="old_password" required>
            </div>
            <div class="form-group">
                <label>Новый пароль (мин. 6 символов)</label>
                <input type="password" name="new_password" required>
            </div>
            <div class="form-group">
                <label>Подтверждение нового пароля</label>
                <input type="password" name="confirm_password" required>
            </div>
            <button type="submit" class="btn-primary">Сменить пароль</button>
        </form>
    </div>
</div>
{% endblock %}
